name: Pages

# Runs the tests and the spec examples, builds every page (home, explainer, specs, devlog) and the
# book, and, on main, deploys docs/ to GitHub Pages. The HTML is not committed: it is built here, so it always
# matches the sources. Pages must use "GitHub Actions" as its source (Settings > Pages).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # once a week, so a link to another site that broke is caught even when nothing here changed
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history: a page's version is the commits that changed it

      - name: No committed HTML
        run: |
          html=$(git ls-files '*.html')
          if [ -n "$html" ]; then
            for f in $html; do echo "::error file=$f::generated page committed: CI builds it, remove it with git rm --cached $f"; done
            exit 1
          fi

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.4"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # the same setup as a laptop or a coding-agent sandbox: atlas (when the one shipped with Nim
      # is too old), libpcre3 for nimib's markdown, and the dependencies pinned in atlas.lock
      - uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ hashFiles('atlas.lock') }}
      - run: sh tools/setup.sh

      - uses: actions/cache@v4
        with:
          path: ~/.cache/nim
          key: nimcache-2.2.4-${{ hashFiles('src/**/*.nim', 'docs/**/*.nim', 'book/**/*.nim', 'tests/*.nim', 'tools/*.nim', '*.nims', 'nim.cfg', 'atlas.lock') }}
          restore-keys: nimcache-2.2.4-

      # nanuq's prebuilt Polars library (about 50 MB), downloaded once for tabelline/nanuq
      - uses: actions/cache@v4
        with:
          path: ~/.cache/nanuq
          key: nanuq-${{ hashFiles('atlas.lock') }}

      - name: Tests
        run: nim r tests/all.nim

      # tabelline also runs as JavaScript (tabelline-polyglot's Gleam package, in a web page): the
      # same tests, compiled by nim js and run in Node, and a build without icons and big datasets
      - name: Tests under JavaScript
        run: nim js -d:nodejs -r tests/js.nim

      - name: A lean build, in C and in JavaScript
        run: |
          nim r -d:tabellineIcons=false -d:tabellineDatasets=false tests/lean.nim
          nim js -d:nodejs -r -d:tabellineIcons=false -d:tabellineDatasets=false tests/lean.nim

      - name: Tests of tabelline/nanuq
        run: nim r -d:nanuqLib=prebuilt tests/test_nanuq.nim

      - name: Spec examples
        run: nim r tools/specexamples.nim

      - name: No new HTML, styles or colours in the pages
        run: nim r tools/drift.nim

      # compiled and run as two steps, so the timings show which of the two is slow
      - name: Compile the pages
        run: nim c -d:release -d:nimibQuiet --hints:off docs/all.nim

      - name: Build the pages
        run: docs/all

      # The book reruns only the chapters whose inputs changed, starting from the chapters' JSON
      # of the live book (book/bookbuild.nim). It never runs Python: the Great Tables outputs are
      # committed in book/gt/outputs/, and a chapter whose outputs are out of date fails here.
      - name: Build the book
        run: nim r -d:nimibQuiet book/bookbuild.nim
        env:
          BOOK_FROM: https://pietroppeter.github.io/tabelline/book
          BOOK_NO_PYTHON: "1"
          BOOK_NO_R: "1"

      # Every link of the pages and the book leads to a page (and its #anchor) of the site. Links to
      # other sites (no 404 or 410) are checked only once a week and by hand: they break without a
      # change here, and checking them took half a minute on every run.
      - name: Links
        run: nim r -d:ssl --hints:off tools/links.nim ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--external' || '' }}

      - name: Assemble site
        run: |
          mkdir _site
          (cd docs && find . \( -name '*.html' -o -name llms.txt \) -not -path './book/*' | tar -c -T - | tar -x -C ../_site)
          # the files every page shares: site.css (written by the build), the fonts, review.js
          cp -r docs/assets _site/assets
          # the book whole: its pages, assets and images, and the chapters' JSON for the next build
          cp -r docs/book _site/book
          find _site -name '*.html' | sort
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
